{% extends "base.html" %}
{% block title %}Imtihon — IELTS ZONE online{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:16px;">
    <div style="width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <p style="color:var(--text-secondary);font-size:15px;">Imtihon yuklanmoqda...</p>
</div>
<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>
{% endblock %}

{% block scripts %}
<script>
// Auto-login via Telegram WebApp initData, then open the test directly
(function() {
    function goToTest() {
        location.href = '/m/{{ section }}/';
    }
    if (window.Telegram && window.Telegram.WebApp) {
        try {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            if (Telegram.WebApp.initData) {
                fetch('{{ url_for("auth.telegram_webapp_login") }}', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'initData=' + encodeURIComponent(Telegram.WebApp.initData)
                }).then(r => r.json()).then(d => {
                    goToTest();
                }).catch(() => { goToTest(); });
            } else {
                goToTest();
            }
        } catch (e) { goToTest(); }
    } else {
        goToTest();
    }
})();
</script>
{% endblock %}
