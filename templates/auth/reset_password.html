{% extends "base.html" %}
{% block title %}Yangi parol{% endblock %}
{% block content %}
<section class="section" style="max-width:420px;margin:0 auto;padding:60px 20px;">
  <div class="card" style="text-align:center;padding:32px;">
    <div style="font-size:48px;margin-bottom:8px;">🔑</div>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:4px;">Yangi parol</h2>
    <p style="color:var(--text-secondary);margin-bottom:24px;font-size:14px;">Yangi parolni kiriting</p>

    <form method="POST" style="text-align:left;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:16px;">
        <label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px;color:var(--text-secondary);">🔐 Yangi parol</label>
        <input type="password" name="password" placeholder="••••••••" required pattern="(?=.*[A-Z])(?=.*[0-9]).{6,}" style="width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;box-sizing:border-box;">
        <small style="color:var(--text-muted);font-size:11px;">6+ belgi, 1 katta harf, 1 raqam</small>
      </div>
      <div style="margin-bottom:20px;">
        <label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px;color:var(--text-secondary);">🔐 Takrorlang</label>
        <input type="password" name="confirm_password" placeholder="••••••••" required style="width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;box-sizing:border-box;">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">✅ Saqlash</button>
    </form>
  </div>
</section>
{% endblock %}
