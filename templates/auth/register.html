{% extends "base.html" %}
{% block title %}Ro'yxatdan o'tish{% endblock %}
{% block content %}
<section class="section" style="max-width:400px;margin:0 auto;padding:60px 20px;">
  <div class="card" style="text-align:center;padding:32px;">
    <div style="font-size:48px;margin-bottom:8px;">✈️</div>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:4px;">Ro'yxatdan o'tish</h2>
    <p style="color:var(--text-secondary);margin-bottom:20px;font-size:14px;">Telegram orqali tez va xavfsiz</p>

    <div style="margin-bottom:20px;padding:16px;background:#e8f5e9;border-radius:12px;border:1px solid #a5d6a7;">
      <p style="font-size:14px;font-weight:600;color:#2e7d32;margin-bottom:8px;">📌 1-qadam: Botga /start yozing</p>
      <a href="https://t.me/IELTSZoneOnlineBot" target="_blank" 
         style="display:block;padding:12px;background:#43a047;color:#fff;border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;">
        ✈️ @IELTSZoneOnlineBot
      </a>
    </div>

    <div style="margin-bottom:20px;padding:16px;background:#fff3e0;border-radius:12px;border:1px solid #ffcc80;">
      <p style="font-size:14px;font-weight:600;color:#e65100;margin-bottom:8px;">📌 2-qadam: Kodni kiriting</p>
      <form method="POST" style="text-align:center;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="code" placeholder="000000" maxlength="6" required
               style="width:200px;padding:16px;border:2px solid var(--border);border-radius:12px;font-size:28px;text-align:center;letter-spacing:10px;font-weight:800;background:var(--bg);color:var(--text);outline:none;margin-bottom:12px;">
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;padding:14px;font-size:16px;">✅ Tasdiqlash</button>
      </form>
    </div>

    <p style="font-size:12px;color:var(--text-muted);">
      <a href="{{ url_for('auth.login') }}" style="color:var(--red);font-weight:700;text-decoration:none;">Kirish</a>
    </p>
  </div>
</section>
{% endblock %}
