{% extends "base.html" %}
{% block title %}Parolni tiklash{% endblock %}
{% block content %}
<section class="section" style="max-width:420px;margin:0 auto;padding:60px 20px;">
  <div class="card" style="text-align:center;padding:32px;">
    <div style="font-size:48px;margin-bottom:8px;">🔐</div>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:4px;">Parolni tiklash</h2>
    <p style="color:var(--text-secondary);margin-bottom:24px;font-size:14px;">Emailingizni yozing, Telegram orqali link yuboramiz</p>

    <form method="POST" style="text-align:left;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:20px;">
        <label style="font-size:13px;font-weight:700;display:block;margin-bottom:6px;color:var(--text-secondary);">📧 Email</label>
        <input type="email" name="email" placeholder="email@example.com" required style="width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:14px;background:var(--bg);color:var(--text);outline:none;box-sizing:border-box;">
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">✈️ Yuborish</button>
    </form>

    <p style="margin-top:20px;font-size:13px;color:var(--text-muted);">
      <a href="{{ url_for('auth.login') }}" style="color:var(--red);font-weight:700;text-decoration:none;">Kirish sahifasiga qaytish</a>
    </p>
  </div>
</section>
{% endblock %}
